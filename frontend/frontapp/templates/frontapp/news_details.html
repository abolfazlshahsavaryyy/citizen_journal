<!DOCTYPE html>
<html>
<head>
    <title>{{ news.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    {% if news %}
        <div class="card">
            <div class="card-body">
                <!-- Page info at the top -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-subtitle text-muted mb-0">{{ news.page_name }}</h5>
                    <span class="badge bg-primary">{{ news.page_follower }} Followers</span>
                </div>

                <!-- News details -->
                <h3 class="card-title">{{ news.title }}</h3>
                <p class="card-text">{{ news.text }}</p>
                <p>👍 {{ news.like_count }} | 💬 {{ news.comment_count }}</p>
                <a href="{% url 'news_comments' news.id %}" class="btn btn-primary mt-3">View Comments</a>
                <small class="text-muted">Published: {{ news.published_date }}</small>
            </div>
        </div>

        <a href="{% url 'home' %}" class="btn btn-secondary mt-3">Back to Home</a>
    {% else %}
        <p>News details not found.</p>
        <a href="{% url 'home' %}" class="btn btn-secondary mt-3">Back to Home</a>
    {% endif %}
</body>
</html>
