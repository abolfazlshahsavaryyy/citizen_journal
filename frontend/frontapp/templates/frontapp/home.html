<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Feed</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center">All News</h1>

        {% if news_list %}
            <div class="row g-4">
                {% for news in news_list %}
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">{{ news.title }}</h5>
                                <p class="card-text flex-grow-1">{{ news.text }}</p>
                                <p class="mb-1"><strong>Page:</strong> {{ news.page_name }}</p>
                                <p class="mb-1">👍 {{ news.like_count }} | 💬 {{ news.comment_count }}</p>
                                <small class="text-muted">Published: {{ news.published_date }}</small>
                                <!-- Details Button -->
                                <a href="{% url 'news_detail' news.id %}" class="btn btn-primary mt-3">View Details</a>

                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-info text-center">No news found.</div>
        {% endif %}
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
